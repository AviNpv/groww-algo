
# ==========================================================================
# GROWW ALGO V2 — COMPLETE STRATEGY CONFIGURATION
#
# Single source of truth for all algorithmic trading rules.
# All trades are SIMULATED (PAPER).
# No real orders are ever placed.
#
# DATA SOURCE:
# Groww = Primary
# Yahoo Finance = Automatic fallback
#
# ==========================================================================

mode: paper

# --------------------------------------------------------------------------
# ENGINE CONFIGURATION
# --------------------------------------------------------------------------

engine:
  enabled: true
  autotrade: true

  scan_interval_sec: 300
  quote_refresh_sec: 20

  entry_window: ["09:20", "14:45"]
  square_off: "15:20"

  timezone: "Asia/Kolkata"

  # Primary + automatic fallback.
  data_source: auto

  data_fallback:
    enabled: true
    primary: groww
    secondary: yahoo

    fallback_on_error: true
    fallback_on_timeout: true
    fallback_on_empty_data: true
    fallback_on_invalid_data: true

    # Data quality protection.
    max_quote_age_sec: 10
    reject_stale_data: true
    validate_ohlcv: true
    verify_timestamps: true

    # Yahoo can maintain scanning but cannot independently
    # authorize a new trade entry.
    allow_fallback_for_scanning: true
    allow_fallback_for_trade_entries: false
    require_primary_confirmation_for_entries: true

    # Return to Groww when it becomes healthy.
    auto_restore_primary: true

  holidays: []

# --------------------------------------------------------------------------
# ACCOUNT & RISK MANAGEMENT
# --------------------------------------------------------------------------

account:
  starting_capital: 10000

  max_positions: 2

  risk_per_trade: 75
  max_daily_loss: 150

  max_position_pct: 45

  max_trades_per_day: 4
  max_trades_per_symbol_per_day: 1

  daily_loss_includes_costs: true

  position_sizing: stop_distance_and_capital

  # Stop new entries after daily loss limit.
  stop_trading_after_daily_loss: true

  # Never increase position size to recover losses.
  prevent_martingale: true

# --------------------------------------------------------------------------
# TRADING COSTS
# --------------------------------------------------------------------------

costs:
  brokerage_per_order: 20
  brokerage_pct: 0.10

  exchange_txn_pct: 0.00297
  sebi_pct: 0.0001

  stamp_buy_pct: 0.003

  gst_pct: 18

  slippage_pct: 0.05

  stt_sell_pct: 0.025

  include_ipft: true

  brokerage_calculation: >
    min(turnover * brokerage_pct / 100, brokerage_per_order)

  apply_brokerage_per_executed_order: true
  calculate_costs_on_entry_and_exit: true

# --------------------------------------------------------------------------
# STOCK UNIVERSE
# --------------------------------------------------------------------------

universe:
  file: config/nifty500.txt

  max_symbols: 140

  min_price: 30

  min_avg_daily_value: 20000000

  exclude: []

  exclude_sme: true
  exclude_etf: true
  exclude_suspended: true
  exclude_trade_to_trade: true

# --------------------------------------------------------------------------
# SCANNER CONFIGURATION
# --------------------------------------------------------------------------

scan:
  max_results: 200

  rank_all_symbols: true

  sort_by: score_descending

  remove_duplicate_signals: true

  show_buy_candidates: true
  show_sell_candidates: true

  show_watchlist: true

# --------------------------------------------------------------------------
# MARKET FILTER
# --------------------------------------------------------------------------

market_filter:
  enabled: true

  benchmark: NIFTY50

  use_market_trend: true

  use_market_volatility_filter: true

  avoid_extreme_market_volatility: true

# --------------------------------------------------------------------------
# BUY / LONG ENTRY RULES
# --------------------------------------------------------------------------

entry:
  enabled: true

  min_score: 65

  min_confirmations: 4

  require_trend: true

  require_above_vwap: true

  require_ema20_above_ema50: true

  breakout_lookback: 20

  min_relative_volume: 1.5

  max_vwap_extension_pct: 2.5

  avoid_first_minutes: 5

  min_atr_pct: 0.4

  max_atr_pct: 3.5

  min_risk_reward: 2.0

  require_candle_confirmation: true

  require_volume_confirmation: true

# --------------------------------------------------------------------------
# SELL / SHORT ENTRY RULES
# --------------------------------------------------------------------------

short_entry:
  enabled: true

  min_score: 65

  min_confirmations: 4

  require_below_vwap: true

  require_below_ema20: true

  require_below_ema50: true

  require_ema20_below_ema50: true

  breakdown_lookback: 20

  min_relative_volume: 1.5

  max_vwap_extension_pct: 2.5

  min_atr_pct: 0.4

  max_atr_pct: 3.5

  min_risk_reward: 2.0

  require_candle_confirmation: true

  require_volume_confirmation: true

  no_overnight_short_positions: true

# --------------------------------------------------------------------------
# EXIT RULES
# --------------------------------------------------------------------------

exit:
  stop_atr_mult: 1.2

  target_r_mult: 2.0

  trailing_atr_mult: 0.8

  trail_after_r: 1.0

  time_stop_minutes: 180

  move_stop_to_be_at_r: 0.8

  square_off: "15:20"

  force_square_off: true

  never_carry_overnight: true

  apply_to_long_and_short: true

# --------------------------------------------------------------------------
# COMPOSITE SCORING SYSTEM
# TOTAL WEIGHT MUST EQUAL 100
# --------------------------------------------------------------------------

scoring:
  weights:
    trend: 22
    momentum: 20
    pattern: 20
    volume: 13
    quality: 15
    risk: 10

  watchlist_score: 55

  qualified_score: 65

  entry_score: 90

  normalize_score: true

  max_score: 100

  risk_score_direction: inverse

  separate_long_short_scores: true

# --------------------------------------------------------------------------
# VOLUME ANALYSIS
# --------------------------------------------------------------------------

volume:
  enabled: true

  lookback_bars: 20

  min_relative_volume: 1.5

  use_time_of_day_average: true

  require_volume_confirmation: true

# --------------------------------------------------------------------------
# FUNDAMENTALS
# --------------------------------------------------------------------------

fundamentals:
  enabled: true

  source: yfinance

  refresh_hours: 24

  non_blocking: true

  use_for_quality_score: true

  never_replace_live_market_data: true

# --------------------------------------------------------------------------
# DATA QUALITY & VALIDATION
# --------------------------------------------------------------------------

data_quality:
  reject_missing_ohlcv: true

  reject_incomplete_candles: true

  reject_stale_quotes: true

  reject_duplicate_candles: true

  verify_market_timestamp: true

  validate_price_continuity: true

  validate_volume: true

  stop_entries_on_data_failure: true

  require_fresh_groww_data_for_entries: true

  allow_yahoo_for_watchlist: true

  allow_yahoo_for_scanning: true

# --------------------------------------------------------------------------
# PAPER TRADING CONFIGURATION
# --------------------------------------------------------------------------

paper_trading:
  enabled: true

  simulate_market_orders: true

  simulate_slippage: true

  simulate_brokerage: true

  simulate_taxes: true

  simulate_partial_fills: true

  live_order_placement: false

  block_live_mode: true

  prevent_real_orders: true

# --------------------------------------------------------------------------
# PERFORMANCE TRACKING
# --------------------------------------------------------------------------

performance:
  track_win_rate: true

  track_profit_factor: true

  track_max_drawdown: true

  track_net_pnl: true

  track_gross_pnl: true

  track_average_risk_reward: true

  track_strategy_performance: true

  track_buy_performance: true

  track_sell_performance: true

  track_data_source_used: true

  daily_report: true

  weekly_report: true

  monthly_report: true

# --------------------------------------------------------------------------
# LOGGING & MONITORING
# --------------------------------------------------------------------------

logging:
  enabled: true

  log_signals: true

  log_entries: true

  log_exits: true

  log_rejections: true

  log_data_source_switches: true

  log_risk_checks: true

  log_api_errors: true

  log_trading_costs: true

  log_paper_pnl: true

# --------------------------------------------------------------------------
# END OF GROWW ALGO V2 CONFIGURATION
# ==========================================================================

