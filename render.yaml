services:
  - type: web
    name: groww-algo-backend
    env: python
    plan: free
    # Build the React UI too, so the backend can serve it at "/".
    # If Node is unavailable in the build image, the committed frontend/dist is used.
    buildCommand: pip install -r requirements.txt && (cd frontend && npm ci && npm run build || echo "Using committed frontend/dist")
    startCommand: python -m uvicorn engine.api:app --host 0.0.0.0 --port $PORT
    envVars:
      PORT: [10000]

  # Standalone real-time agent chat. Separate service, separate URL.
  # It calls the backend above via /api, so no credentials are needed here.
  - type: web
    name: groww-agent-chat
    env: static
    plan: free
    buildCommand: echo "static agent chat"
    staticPublishPath: ./agent-chat-site
